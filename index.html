<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F3EC">
<meta name="description" content="Rent and bill tracker for 110 Evergreen Ave">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Evergreen">
<title>Evergreen House</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
<script>try{var t=localStorage.getItem('eh-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);if(localStorage.getItem('eh-density')!=='detailed')document.documentElement.classList.add('simple');var z=localStorage.getItem('eh-text');if(z==='1.12'||z==='1.25')document.documentElement.setAttribute('data-text',z)}catch(e){}</script>
</head>
<body>
<div id="app" aria-live="polite"><div class="splash"><img src="icons/icon-192.png" alt="" width="72" height="72"><p>Loading…</p></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="fx" aria-hidden="true"></div>
<div id="ptr" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg></div>
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
