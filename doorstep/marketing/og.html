<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: 'Inter'; src: url('../fonts/inter.woff2'); font-weight: 100 900; }
@font-face { font-family: 'Fraunces'; src: url('../fonts/fraunces.woff2'); font-weight: 100 900; }
body{margin:0;width:1200px;height:630px;overflow:hidden;font-family:Inter;color:#fff;background:radial-gradient(120% 90% at 85% 0%,#3D5FC4,#2F4BA8 40%,#1A2A66);position:relative}
.rays{position:absolute;inset:0;background:repeating-conic-gradient(from 200deg at 85% 0%,rgba(255,255,255,.06) 0 6deg,transparent 6deg 18deg)}
.logo{position:absolute;left:70px;top:60px;display:flex;gap:16px;align-items:center;font-family:Fraunces;font-weight:700;font-size:40px}
.logo img{width:64px;height:64px;border-radius:16px}
h1{position:absolute;left:70px;top:160px;margin:0;font-family:Fraunces;font-size:74px;line-height:1.02;width:640px;letter-spacing:-1px}
h1 em{font-style:normal;color:#F2D58A}
p{position:absolute;left:70px;top:470px;margin:0;font-size:26px;color:#D6DEFA;width:640px;line-height:1.4}
.phone{position:absolute;right:90px;top:70px;width:300px;padding:10px;border-radius:44px;background:#0E1430;transform:rotate(5deg);box-shadow:0 40px 80px -30px rgba(0,0,0,.6)}
.phone img{width:100%;border-radius:36px;display:block}
.free{position:absolute;right:400px;top:40px;width:120px;height:120px;border-radius:50%;background:#F2D58A;color:#1A2A66;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-10deg);font-family:Fraunces;font-weight:800;font-size:32px;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.free span{font:700 12px Inter;letter-spacing:.1em;text-transform:uppercase}
</style></head><body><div class="rays"></div>
<div class="logo"><img src="img/logo.png">Doorstep</div>
<h1>Rent, bills &amp; repairs. <em>Right at your doorstep.</em></h1>
<p>Free for small landlords. No ads, no bank login.</p>
<div class="free">Free<span>no ads</span></div>
<div class="phone"><img src="img/home.png"></div></body></html>
